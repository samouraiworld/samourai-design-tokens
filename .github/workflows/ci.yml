name: CI

on:
  # Only `main` on push — feature branches are already covered by
  # `pull_request`, and running both made the required checks flap between two
  # runs of the same commit.
  push:
    branches: [main]
    # Tag pushes, because a tag NAME and its annotation are surfaces the
    # attribution rule names and no other event carries them.
    tags: ["**"]
  # `edited` is not in the default set (`opened, synchronize, reopened`), and
  # without it the title and body gates below are advisory: both stay editable
  # after the checks pass, so a clean run could be banked and the text made
  # dirty afterwards with nothing re-reading it.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # First, and with no setup-node above it: the cheapest gate here, and the one
  # whose failure says nothing about the tokens under review.
  dot-entries:
    name: Tracked dot-entries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A gate nobody has watched refuse a bad input is a comment rather than a
      # gate. The self-test runs first and asserts each refusal MESSAGE, not its
      # exit code -- the order the two `ci-ok` scripts already use.
      - name: Prove the dot-entry check can fail
        run: .github/scripts/check-tracked-dot-entries.selftest.sh
      # Development tooling keeps local configuration in a dot-directory at the
      # repository root, and one `git add .` commits it -- here, into a public
      # repository. `.git/info/exclude` protects only the clone it was typed in;
      # this check travels with the repository, so it protects every clone.
      - name: Every tracked dot-entry is on the allowlist
        run: .github/scripts/check-tracked-dot-entries.sh

  gates:
    name: Grammar, contrast, drift, units
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `cache:` and no `npm ci`. This package has no dependencies on
      # purpose (see docs/adr/0001), so there is no lockfile to hash and
      # nothing to install; asking setup-node to cache without a lockfile
      # FAILS the job outright.
      #
      # `cache:` is not the only way in. setup-node caches automatically,
      # with no `cache:` written anywhere, whenever package.json declares a
      # package manager -- the top-level `packageManager` field, or (since
      # v6) `devEngines.packageManager`. This package.json declares neither,
      # so the paragraph above was enforced by an absence rather than by a
      # setting: the day someone adds a `packageManager` field, the caching
      # it warns about switches itself on and the job starts failing for a
      # reason nothing in this file mentions. `package-manager-cache: false`
      # is that guard written down, and it holds whatever package.json grows.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # The four gates, in one command, all of them run even after one fails.
      # `npm run build` is deliberately NOT run here: the drift gate asserts
      # that the committed dist/ already equals a fresh build, and building
      # first would make that assertion vacuous.
      - name: Gates
        run: npm test

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tip

      # A verification step nobody has seen reject anything is a decoration:
      # prove sha256sum -c actually refuses a mismatch before trusting it to
      # gate a real download.
      - name: Prove checksum verification can fail before gitleaks runs
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          printf 'not the real gitleaks archive\n' > "$work/sample"
          real="$(sha256sum "$work/sample" | awk '{print $1}')"
          wrong="$(printf '%064d' 0)"

          if ! ( printf '%s  %s\n' "$real" "$work/sample" | sha256sum -c - >"$work/ok.log" 2>&1 ); then
            echo "self-test FAILED: the correct checksum was rejected" >&2
            cat "$work/ok.log" >&2
            exit 1
          fi
          echo "  ok  a correct checksum is accepted"

          if ( printf '%s  %s\n' "$wrong" "$work/sample" | sha256sum -c - >"$work/bad.log" 2>&1 ); then
            echo "self-test FAILED: a wrong checksum was accepted" >&2
            cat "$work/bad.log" >&2
            exit 1
          fi
          if ! grep -q FAILED "$work/bad.log"; then
            echo "self-test FAILED: rejection was not reported as a checksum mismatch" >&2
            cat "$work/bad.log" >&2
            exit 1
          fi
          echo "  ok  a wrong checksum is rejected, before the gitleaks archive is trusted"

      # The gitleaks ACTION requires a paid licence for GitHub organisations.
      # The gitleaks BINARY is MIT and unrestricted, so run it directly.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
          # Confirmed two independent ways: `shasum -a 256` on the downloaded
          # asset, and the matching line in gitleaks' own published
          # gitleaks_<version>_checksums.txt. Bump this alongside the version.
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      # A scanner nobody has watched fail is not a gate. The throwaway key is
      # generated on the runner rather than written into this file: a literal
      # here would be a real finding, and the scanner would flag the very
      # workflow that tests it. The runner is discarded after the job.
      - name: Prove the scanner can fail
        run: |
          set -euo pipefail
          probe="$(mktemp -d)"
          openssl genrsa -out "$probe/probe.pem" 2048 2>/dev/null
          status=0
          /tmp/gitleaks detect --no-git --source "$probe" --redact --exit-code 1 \
            --report-format json --report-path "$probe/report.json" || status=$?
          # Exactly 1, not merely non-zero: a missing or unrunnable binary exits
          # 126 or 127, which would otherwise read as "the leak was caught".
          if [ "$status" -ne 1 ]; then
            echo "::error::probe expected exit 1 from the scanner, got $status"
            exit 1
          fi
          found=$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))))' \
            "$probe/report.json")
          if [ "$found" -ne 1 ]; then
            echo "::error::probe expected exactly one finding, got $found"
            exit 1
          fi
          echo "the probe was caught: exit 1, one finding"
      # Scan the history this branch actually has. `detect` defaults to
      # `--all`, so with fetch-depth 0 a finding on any other branch failed
      # this job on every branch except the one that introduced it — which,
      # having no pull request open, was never scanned at all.
      - name: gitleaks
        run: |
          set -euo pipefail
          /tmp/gitleaks detect --source . --log-opts="--full-history HEAD" \
            --redact --verbose --exit-code 1

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A verification step nobody has seen reject anything is a decoration:
      # prove sha256sum -c actually refuses a mismatch before trusting it to
      # gate a real download.
      - name: Prove checksum verification can fail before actionlint runs
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          printf 'not the real actionlint archive\n' > "$work/sample"
          real="$(sha256sum "$work/sample" | awk '{print $1}')"
          wrong="$(printf '%064d' 0)"

          if ! ( printf '%s  %s\n' "$real" "$work/sample" | sha256sum -c - >"$work/ok.log" 2>&1 ); then
            echo "self-test FAILED: the correct checksum was rejected" >&2
            cat "$work/ok.log" >&2
            exit 1
          fi
          echo "  ok  a correct checksum is accepted"

          if ( printf '%s  %s\n' "$wrong" "$work/sample" | sha256sum -c - >"$work/bad.log" 2>&1 ); then
            echo "self-test FAILED: a wrong checksum was accepted" >&2
            cat "$work/bad.log" >&2
            exit 1
          fi
          if ! grep -q FAILED "$work/bad.log"; then
            echo "self-test FAILED: rejection was not reported as a checksum mismatch" >&2
            cat "$work/bad.log" >&2
            exit 1
          fi
          echo "  ok  a wrong checksum is rejected, before the actionlint archive is trusted"

      # A typo in a workflow key is not an error: GitHub ignores the unknown
      # key and the step it belonged to quietly never runs. actionlint is the
      # only thing that reads these files strictly.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.7
          # Confirmed two independent ways: `shasum -a 256` on the downloaded
          # asset, and the matching line in actionlint's own published
          # actionlint_<version>_checksums.txt. Bump this alongside the version.
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color

  # The single check branch protection points at. Requiring the four jobs above
  # by name instead would put the gate list in repository settings, where it
  # rots out of sync with this file: renaming a job leaves the old context
  # required forever — blocking every PR on a check nothing will ever report —
  # while the job that replaced it is required by nothing at all.
  #
  # `if: always()` is what makes the aggregate honest. Without it, a failed or
  # skipped dependency SKIPS this job too, and a skipped required check is
  # reported to branch protection as satisfied: the merge button goes green
  # precisely because a gate went red. The verdict itself lives in a script so
  # the self-test below can prove it still turns this job red.
  attribution:
    name: Vendor attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The self-test runs first, so every pipeline re-proves the check can
      # still fail — and fails for the right reason. It asserts the message the
      # check prints AND its exit status. The message because this check has
      # several independent ways of finding something and one bit cannot tell a
      # working branch from a silently broken one; the exit status because that
      # one bit is the whole of what this job consumes. Asserting only the
      # message let the refusal be flipped to a pass while all 13 cases passed.
      - name: Prove this check can fail
        run: .github/scripts/check-vendor-attribution.selftest.sh
      # Reads every tracked file as bytes, decodes base64 runs and inflates
      # compressed PNG text chunks: both of the ways attribution actually
      # arrived in this org are invisible to a recursive grep.
      - name: No tracked file carries assistant attribution
        run: python3 .github/scripts/check-vendor-attribution.py .

  metadata-attribution:
    name: Vendor attribution (the surfaces that are not files)
    runs-on: ubuntu-latest
    defaults:
      run:
        # Every step here pipes a producer into the checker, and the default
        # shell is `bash -e` WITHOUT pipefail: a `git` that failed would send an
        # empty stream on and the surface would read as absent. Naming bash
        # explicitly gets `-eo pipefail`, so "could not look" stays a failure.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The branch's own commits have to be reachable, and the base sha the
          # range starts from with them. No `ref:`: this action adds a
          # `refs/pull/*` refspec only when `ref` starts with `refs/pull/`, so a
          # bare sha from a FORK is in no fetched ref and the checkout fails.
          # This repository is public, so fork pull requests are the normal case.
          fetch-depth: 0
      # The job above scans tracked files. `git ls-files` cannot see a commit
      # message, a branch name, a pull-request title or body, or a tag — and the
      # rule names every one of them. This repository is public, so each of those
      # is world-readable the moment it is pushed.
      - name: Prove these checks can fail
        run: .github/scripts/check-vendor-attribution.selftest.sh
      # Event data reaches the shell through `env:`, never interpolated into a
      # `run:` body. On a public repository a pull-request title is written by
      # whoever opened it.
      - name: The branch name carries no attribution
        env:
          REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: >-
          printf '%s' "$REF" |
          python3 .github/scripts/check-vendor-attribution.py --text "branch name"
      - name: No commit message on this branch carries attribution
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # On a pull request, every commit the branch adds — ending at the head
          # sha, not at the checked-out merge commit, whose message GitHub
          # generates and nobody authored. Otherwise the head commit alone.
          #
          # Two dots are right HERE and wrong for a diff. `git log A..B` is the
          # set of commits in B and not in A, which is the branch's own commits
          # whether or not A is an ancestor. The residue rule that says to use a
          # merge base is about `git diff`. Do not "fix" this by analogy with it.
          if [ -n "$BASE" ]; then range="$BASE..$HEAD_SHA"; else range="-1"; fi
          git log --format=%B "$range" |
            python3 .github/scripts/check-vendor-attribution.py --text "commit messages on this branch"
      # Conditional on the event rather than tolerant of an empty surface.
      # `--allow-empty` on the title would have absorbed a typo in the field name
      # for good: `.titel` is empty on every event, reads as "not a pull request",
      # and passes forever. A step-level `if:` skips the step, not the job.
      - name: The pull request title carries no attribution
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: >-
          printf '%s' "$TITLE" |
          python3 .github/scripts/check-vendor-attribution.py
          --text "pull request title"
      # The body keeps `--allow-empty` — GitHub requires a title and not a body —
      # and a bot's body is exempt, which is owner decision B4 (2026-09-09) as
      # implemented in kodera-internal's merge gate: Dependabot quotes an upstream
      # changelog it did not write. The title, commits and diff are still scanned
      # for a bot. Nothing gates this condition, so this comment is the record
      # that the exemption is deliberate.
      - name: The pull request body carries no attribution
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.type != 'Bot'
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: >-
          printf '%s' "$BODY" |
          python3 .github/scripts/check-vendor-attribution.py
          --text "pull request body" --allow-empty
      - name: No tag on this commit carries attribution
        run: >-
          git tag --points-at HEAD --format='%(refname:strip=2)%0a%(contents)' |
          python3 .github/scripts/check-vendor-attribution.py
          --text "tags on this commit" --allow-empty

  required-clauses:
    name: Required clauses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every gate here refuses something PRESENT. None of them had an opinion
      # about a rule going ABSENT, which is how a merge taking `main..branch` as a
      # stale branch's residue reverted the attribution policy and the Dependabot
      # cap on another repository on 2026-09-12, with CI green throughout.
      - name: Prove the clause check can fail
        run: .github/scripts/check-required-clauses.selftest.sh
      - name: Every clause this repository must carry is still there
        run: python3 .github/scripts/check-required-clauses.py .

  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    if: always()
    needs: [attribution, metadata-attribution, required-clauses, gates, secret-scan, workflows, dot-entries]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prove this gate can fail
        run: .github/scripts/aggregate-result.selftest.sh
      # A gate present in the workflow but absent from `needs:` above can fail
      # while this required check stays green. Proven before it is relied on.
      - name: Prove the coverage check can fail
        run: .github/scripts/check-aggregate-covers-jobs.selftest.sh
      - name: This gate depends on every other job
        run: python3 .github/scripts/check-aggregate-covers-jobs.py
      # No job in this workflow is conditional, so nothing may skip. A gate
      # that gains an `if:` must be named below deliberately, in its own diff.
      - name: Every gate passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: printf '%s' "$RESULTS" | python3 .github/scripts/aggregate-result.py
